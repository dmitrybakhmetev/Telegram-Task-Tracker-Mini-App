<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Task Tracker Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем отдельный файл стилей -->
    <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>

    <!-- Сайдбар -->
    <div class="sidebar">
        <div>
            <div class="sidebar-logo">Focusly</div>
            <div class="sidebar-menu">
                <div class="menu-item active" onclick="switchView('dashboard', this)">📊 Дашборд</div>
                <div class="menu-item" onclick="switchView('schedule', this)">📅 Расписание</div>
            </div>
        </div>
        <div style="font-size: 12px; color: var(--text-secondary);">v2.1 Pro</div>
    </div>

    <!-- Основной контент -->
    <div class="main-content">
        <div class="top-bar">
            <div class="user-profile" id="user-profile">
                <span>👤 Загрузка...</span>
            </div>
        </div>

        <!-- 1. Интерактивный Дашборд -->
        <div id="view-dashboard" class="view-section active-view">
            <div class="schedule-header">
                <div>
                    <h2>📊 Центр управления</h2>
                    <p style="margin: 2px 0 0 0; font-size: 13px; color: var(--text-secondary);">Интерактивная сводка вашей активности</p>
                </div>
                <button class="btn btn-primary" onclick="openCreateModal()">+ Новая задача</button>
            </div>

            <div class="dash-grid">
                <div class="card-box">
                    <div class="stat-card-flex">
                        <div>
                            <span style="font-size: 12px; color: var(--text-secondary); font-weight: 600;">ВСЕГО ЗАДАЧ</span>
                            <div class="big-number" id="dash-total">0</div>
                        </div>
                        <div class="badge-pill">Активно</div>
                    </div>
                </div>
                <div class="card-box">
                    <div class="stat-card-flex">
                        <div>
                            <span style="font-size: 12px; color: var(--text-secondary); font-weight: 600;">ЗАДАЧ НА СЕГОДНЯ</span>
                            <div class="big-number" id="dash-today-count" style="color: #0284c7;">0</div>
                        </div>
                        <div class="badge-pill" style="background: var(--yellow-card); color: #b45309;">Сегодня</div>
                    </div>
                </div>
            </div>

            <div class="card-box" style="margin-bottom: 16px;">
                <h3 style="margin-top: 0; font-size: 16px;">🔥 Ближайшие события</h3>
                <div id="dash-upcoming-list" style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
                    <p style="color: var(--text-secondary); font-size: 13px; margin: 0;">Загрузка ближайших задач...</p>
                </div>
            </div>
        </div>

        <!-- 2. Расписание (Неделя) -->
        <div id="view-schedule" class="view-section">
            <div class="schedule-header">
                <div>
                    <h2 id="week-range-title">Расписание недели</h2>
                    <p style="margin: 2px 0 0 0; font-size: 13px; color: var(--text-secondary);" id="current-month-label">Октябрь 2026</p>
                </div>
                <div class="action-buttons">
                    <button class="btn" onclick="changeWeek(-1)">‹ Назад</button>
                    <button class="btn" onclick="changeWeek(1)">Вперед ›</button>
                    <button class="btn btn-primary" onclick="openCreateModal()">+ Задача</button>
                </div>
            </div>
            <div class="week-grid" id="week-grid"></div>
        </div>
    </div>

    <!-- Мобильная навигация -->
    <div class="mobile-nav">
        <div class="mob-item active" onclick="switchView('dashboard', this)">📊 Дашборд</div>
        <button class="fab-mobile" onclick="openCreateModal()">+</button>
        <div class="mob-item" onclick="switchView('schedule', this)">📅 План</div>
    </div>

    <!-- Модальное окно создания / редактирования задачи -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top: 0; font-size: 18px;">Новое событие</h3>
            <input type="hidden" id="task-id">
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="task-title" placeholder="Например: Встреча команды">
            </div>
            <div class="form-group">
                <label>Дата</label>
                <input type="date" id="task-date">
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Начало</label>
                    <input type="time" id="task-start" value="10:00">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Конец</label>
                    <input type="time" id="task-end" value="11:00">
                </div>
            </div>
            <button class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;" onclick="saveTask()">Сохранить</button>
            <button class="btn" style="width: 100%; margin-top: 6px; border:none;" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <!-- Подключаем отдельный файл логики -->
    <script src="/frontend/script.js"></script>
</body>
</html>
